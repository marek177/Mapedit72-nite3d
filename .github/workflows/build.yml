name: Windows build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x86, win-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/MapEdit72N3D/MapEdit72N3D.csproj
      - name: Publish
        run: dotnet publish src/MapEdit72N3D/MapEdit72N3D.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o publish/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: MapEdit72N3D-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/
